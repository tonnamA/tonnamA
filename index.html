<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Engineering from Scratch — Reference Manual &amp; Full Curriculum</title>
    <meta
      name="description"
      content="Implement model internals, retrieval pipelines, and agent runtimes from scratch. 542 lessons across 20 phases in Python, TypeScript, Rust, Julia, and Go."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=VT323&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('aiefs_theme');
          if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
          var lang = localStorage.getItem('aiefs_lang');
          if (lang === 'th') {
            document.documentElement.setAttribute('data-lang', 'th');
            document.documentElement.lang = 'th';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
